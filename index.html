<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DMK Portal</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057B8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DMK Portal">

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0A1628;
  color:white;
}

.page{
  display:none;
  min-height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.page.active{
  display:flex;
}

input{
  padding:10px;
  margin:6px;
  border-radius:8px;
  border:none;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#0057B8;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="page-login" class="page active">

<h2>DMK Portal Login</h2>

<form onsubmit="event.preventDefault(); doLogin();">
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button>Login</button>
</form>

<p id="err" style="color:red"></p>

</div>


<!-- DASHBOARD -->
<div id="page-dashboard" class="page">

<h2>Welcome DMK Portal</h2>

<button onclick="logout()">Logout</button>

</div>



<script>
/* ===============================
   SIMPLE ROUTER
=================================*/

function showPage(name){

document.querySelectorAll('.page')
.forEach(p=>{
p.classList.remove('active');
});

document
.getElementById('page-'+name)
.classList.add('active');

}


/* ===============================
   SESSION SYSTEM
=================================*/

const SESSION="dmk_session";

function saveSession(data){
localStorage.setItem(SESSION,JSON.stringify(data));
}

function loadSession(){
return JSON.parse(localStorage.getItem(SESSION));
}

function clearSession(){
localStorage.removeItem(SESSION);
}


/* ===============================
   LOGIN
=================================*/

function doLogin(){

const u=user.value;
const p=pass.value;

if(u==="admin" && p==="123"){

saveSession({user:u});

showPage("dashboard");

}else{
err.innerText="Login gagal";
}

}


/* ===============================
   LOGOUT
=================================*/

function logout(){
clearSession();
showPage("login");
}


/* ===============================
   AUTO LOGIN
=================================*/

window.addEventListener("DOMContentLoaded",()=>{

const session=loadSession();

if(session){
showPage("dashboard");
}else{
showPage("login");
}

});

</script>



<!-- ===============================
     SERVICE WORKER REGISTER
================================ -->

<script>
if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker
.register('./service-worker.js')
.then(()=>console.log("DMK PWA Ready ✅"));

});

}
</script>



<!-- ===============================
     INSTALL BUTTON
================================ -->

<script>

let deferredPrompt;

window.addEventListener('beforeinstallprompt',e=>{

e.preventDefault();
deferredPrompt=e;

const btn=document.createElement('button');

btn.innerText="Install DMK App";

btn.style.cssText=
"position:fixed;bottom:80px;right:20px;padding:14px;border-radius:12px;background:#0057B8;color:#fff;z-index:9999";

btn.onclick=async()=>{
deferredPrompt.prompt();
await deferredPrompt.userChoice;
btn.remove();
};

document.body.appendChild(btn);

});
</script>

</body>
</html>
