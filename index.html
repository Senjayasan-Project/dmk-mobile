<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

</head>
<body>

<!-- ================= LOGIN ================= -->

<div id="page-login" class="page active">

<h2>DMK Portal Login</h2>

<form onsubmit="event.preventDefault(); login();">

<input id="email" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<!-- ================= DASHBOARD ================= -->

<div id="page-dashboard" class="page">

<h2 id="welcome"></h2>

<button onclick="loadOrders()">Load Orders</button>

<pre id="orders"></pre>

<button onclick="logout()">Logout</button>

</div>



<script>

/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL="https://slrjqrynjqftfivoarmw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscmpxcnluanFmdGZpdm9hcm13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTkyNDQsImV4cCI6MjA5MTI5NTI0NH0.iRKpYEyM4rEkxKM36lMTRFgP8GKDKMP8pTXfo02i4Lg";

/* ==============================
   SUPABASE CONNECTION
============================== */

const SUPABASE_URL="PASTE_PROJECT_URL";
const SUPABASE_KEY="PASTE_ANON_KEY";

const sb = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ==============================
   ROUTER
============================== */

function showPage(name){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById("page-"+name)
.classList.add("active");

}


/* ==============================
   SESSION
============================== */

const SESSION="dmk_session";

function saveSession(data){
localStorage.setItem(SESSION,JSON.stringify(data));
}

function loadSession(){
return JSON.parse(localStorage.getItem(SESSION));
}

function clearSession(){
localStorage.removeItem(SESSION);
}


/* ==============================
   LOGIN FROM TABLE user
============================== */

async function login(){

err.innerText="";

const usernameInput =
document.getElementById("email").value;

const passwordInput =
document.getElementById("password").value;


/* QUERY DATABASE */

const {data,error} = await sb
.from("user")
.select("*")
.eq("username",usernameInput)
.eq("password",passwordInput)
.single();


if(error || !data){
err.innerText="Username / Password salah";
return;
}


/* SAVE SESSION */

saveSession(data);

document.getElementById("welcome")
.innerText="Welcome "+data.username;

showPage("dashboard");

}


/* ==============================
   AUTO LOGIN
============================== */

window.addEventListener("DOMContentLoaded",()=>{

const session=loadSession();

if(session){
welcome.innerText="Welcome "+session.username;
showPage("dashboard");
}else{
showPage("login");
}

});


/* ==============================
   LOGOUT
============================== */

function logout(){

clearSession();

showPage("login");

}

</script>



<!-- ================= SERVICE WORKER ================= -->

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker
.register("./service-worker.js")
.then(()=>console.log("DMK PWA Ready ✅"));

});

}

</script>



<!-- ================= INSTALL BUTTON ================= -->

<script>

let deferredPrompt;

window.addEventListener("beforeinstallprompt",e=>{

e.preventDefault();

deferredPrompt=e;

const btn=document.createElement("button");

btn.innerText="Install DMK App";

btn.style.cssText=
"position:fixed;bottom:80px;right:20px;padding:14px;border-radius:12px;background:#0057B8;color:#fff;z-index:9999";

btn.onclick=async()=>{
deferredPrompt.prompt();
await deferredPrompt.userChoice;
btn.remove();
};

document.body.appendChild(btn);

});

</script>

</body>
</html>
