<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DMK Portal</title>

<!-- ================= PWA ================= -->

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0057B8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DMK Portal">

<!-- ================= SUPABASE SDK ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0A1628;
color:white;
}

.page{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
}

.page.active{
display:flex;
}

input{
padding:12px;
margin:6px;
border-radius:10px;
border:none;
width:220px;
}

button{
padding:12px 20px;
border:none;
border-radius:12px;
background:#0057B8;
color:white;
cursor:pointer;
}

</style>

</head>
<body>

<!-- ================= LOGIN ================= -->

<div id="page-login" class="page active">

<h2>DMK Portal Login</h2>

<form onsubmit="event.preventDefault(); login();">

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button>Login</button>

</form>

<p id="err" style="color:red"></p>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="page-dashboard" class="page">

<h2 id="welcome"></h2>

<button onclick="loadOrders()">Load Orders</button>

<pre id="orders"></pre>

<button onclick="logout()">Logout</button>

</div>



<script>

/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL="https://slrjqrynjqftfivoarmw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNscmpxcnluanFmdGZpdm9hcm13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTkyNDQsImV4cCI6MjA5MTI5NTI0NH0.iRKpYEyM4rEkxKM36lMTRFgP8GKDKMP8pTXfo02i4Lg";

const sb = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================
   ROUTER
===================================== */

function showPage(name){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById("page-"+name)
.classList.add("active");

}


/* =====================================
   LOGIN
===================================== */

async function login(){

err.innerText="";

const {data,error}=
await sb.auth.signInWithPassword({
email:email.value,
password:password.value
});

if(error){
err.innerText=error.message;
return;
}

initUser();

}


/* =====================================
   AUTO SESSION
===================================== */

async function initUser(){

const {data:{user}}=
await sb.auth.getUser();

welcome.innerText=
"Welcome "+(user.email||"User");

showPage("dashboard");

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

await sb.auth.signOut();

showPage("login");

}


/* =====================================
   LOAD DATABASE DATA
===================================== */

async function loadOrders(){

const {data,error}=
await sb
.from("orders")
.select("*");

orders.innerText=
JSON.stringify(data,null,2);

}


/* =====================================
   AUTO LOGIN ON LOAD
===================================== */

window.addEventListener("DOMContentLoaded",async()=>{

const {data:{session}}=
await sb.auth.getSession();

if(session){
initUser();
}else{
showPage("login");
}

});

</script>



<!-- ================= SERVICE WORKER ================= -->

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker
.register("./service-worker.js")
.then(()=>console.log("DMK PWA Ready ✅"));

});

}

</script>



<!-- ================= INSTALL BUTTON ================= -->

<script>

let deferredPrompt;

window.addEventListener("beforeinstallprompt",e=>{

e.preventDefault();

deferredPrompt=e;

const btn=document.createElement("button");

btn.innerText="Install DMK App";

btn.style.cssText=
"position:fixed;bottom:80px;right:20px;padding:14px;border-radius:12px;background:#0057B8;color:#fff;z-index:9999";

btn.onclick=async()=>{
deferredPrompt.prompt();
await deferredPrompt.userChoice;
btn.remove();
};

document.body.appendChild(btn);

});

</script>

</body>
</html>
